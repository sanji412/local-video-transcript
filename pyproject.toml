[project]
name = "local-video-transcript"
version = "0.2.0"
description = "本地视频文案提取器"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20",
  "yt-dlp>=2026.3",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.30,<1",
]

[project.optional-dependencies]
local = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
